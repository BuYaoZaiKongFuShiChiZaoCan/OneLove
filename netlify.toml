[build]
  publish = "."
  command = "npm run build"
  functions = "backend"

[build.environment]
  NODE_VERSION = "18"
  NODE_ENV = "production"

[functions]
  directory = "backend"
  node_bundler = "esbuild"
  external_node_modules = ["express", "cors", "bcryptjs", "jsonwebtoken", "mongoose", "dotenv", "morgan", "helmet", "express-validator", "multer", "serverless-http"]

# 环境变量配置
# 生产环境变量：不要把敏感信息写进仓库！
# 请在 Netlify 后台（Site settings → Build & deploy → Environment）配置以下变量：
# - JWT_SECRET
# - MONGODB_URI
# - CORS_ORIGIN (可选)
# - NODE_ENV=production (可选)

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 3000
  publish = "."
  framework = "#static"

[[plugins]]
  package = "@netlify/plugin-functions-install-core" 