[build]
  publish = "."
  command = "npm run build"
  functions = "backend/netlify-functions"

[build.environment]
  NODE_VERSION = "18"
  NODE_ENV = "production"

[functions]
  directory = "backend/netlify-functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "cors", "bcryptjs", "jsonwebtoken", "mongoose", "dotenv", "morgan", "helmet", "express-validator", "multer", "serverless-http"]

# 生产环境占位（真实值放 Netlify 面板）
[context.production.environment]
  NODE_ENV = "production"
  JWT_SECRET = "REPLACE_IN_NETLIFY_DASHBOARD"
  MONGODB_URI = "REPLACE_IN_NETLIFY_DASHBOARD"
  CORS_ORIGIN = "https://uplove.netlify.app"
  APP_VERSION = "1.0.0"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 3000
  publish = "."
  framework = "#static"

[[plugins]]
  package = "@netlify/plugin-functions-install-core" 