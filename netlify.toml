[build]
  publish = "."
  command = "npm run build"
  functions = "backend/netlify-functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  # 避免机密扫描对常见键名/文档文件误报（不影响真正的环境变量注入）
  SECRETS_SCAN_OMIT_KEYS = "PORT,NODE_ENV,CORS_ORIGIN,JWT_SECRET,MONGODB_URI"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/plugins/**,**/README*.md,**/README*.bak,**/package-lock.json,Pages/**,backend/config.env.example"

[functions]
  directory = "backend/netlify-functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "cors", "bcryptjs", "jsonwebtoken", "mongoose", "dotenv", "morgan", "helmet", "express-validator", "multer", "serverless-http"]

# 环境变量配置
[context.production.environment]
  NODE_ENV = "production"
  JWT_SECRET = "OneLove_JWT_Secret_2024_Production_Key_For_Security"
  MONGODB_URI = "mongodb+srv://LG2457OneLove:LG2457OneLove@onelove.bepz2u0.mongodb.net/?retryWrites=true&w=majority&appName=OneLove"
  DB_NAME = "onelove"
  CORS_ORIGIN = "https://yibiling.netlify.app"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 2457
  publish = "."
  framework = "#static"

[[plugins]]
  package = "@netlify/plugin-functions-install-core" 